{% extends 'base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-12">
    <div class="mb-6">
        <a href="{% url 'eventos_publicos' %}" class="inline-flex items-center gap-2 text-sm font-semibold text-slate-600 hover:text-blue-600 transition">
            <i class="fa-solid fa-arrow-left text-xs"></i> Volver a Eventos
        </a>
        <h1 class="text-2xl font-black text-slate-900 mt-2">Registrar Evento en Pucusana</h1>
    </div>

    <div class="bg-white p-6 sm:p-8 rounded-3xl shadow-xl border border-slate-100">
        <form method="POST" enctype="multipart/form-data" class="space-y-4">
            {% csrf_token %}

            <div>
                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Título del Evento *</label>
                <input type="text" name="titulo" required class="input input-bordered w-full rounded-xl text-sm" placeholder="Ej. Festival Marino y del Ceviche">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Descripción *</label>
                <textarea name="descripcion" rows="3" required class="textarea textarea-bordered w-full rounded-xl text-sm" placeholder="Detalle de actividades, horarios y dinámicas..."></textarea>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Categoría</label>
                    <select name="categoria" class="select select-bordered w-full rounded-xl text-sm">
                        <option value="">Selecciona categoría</option>
                        {% for cat in categorias %}
                            <option value="{{ cat.id }}">{{ cat.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Ubicación *</label>
                    <input type="text" name="ubicacion" required class="input input-bordered w-full rounded-xl text-sm" placeholder="Ej. Malecón San Martín">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Fecha y Hora de Inicio *</label>
                    <input type="datetime-local" name="fecha_inicio" required class="input input-bordered w-full rounded-xl text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Fecha y Hora de Fin *</label>
                    <input type="datetime-local" name="fecha_fin" required class="input input-bordered w-full rounded-xl text-sm">
                </div>
            </div>

            <div class="pt-4 flex justify-end gap-3 border-t border-slate-100">
                <a href="{% url 'eventos_publicos' %}" class="btn btn-ghost rounded-xl">Cancelar</a>
                <button type="submit" class="btn btn-primary bg-blue-600 hover:bg-blue-700 text-white rounded-xl px-6 border-none">
                    Guardar y Publicar
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
